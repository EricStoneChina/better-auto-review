# Better Auto Review bundle patch
#
# Two loader operations:
# 1. Override the core `permission` row to add an `auto-mode` preset
#    (workspace-write + ask). A patch replaces the row's whole config, so every
#    built-in preset is restated here. The key is `auto-mode` on purpose: the
#    Claude-style skin's fixed "Auto" segment maps `auto-mode` before `auto`, so
#    choosing Auto there runs this reviewer instead of the built-in every-call
#    auto reviewer.
# 2. Insert this bundle's own plugin row, wired to the reviewer route.

- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    # New sessions start in the reviewer-backed preset automatically, so the
    # user never has to pick "Better Auto Review" by hand. They can still switch
    # to any other preset from the selector; a later session re-applies this.
    defaultPreset: auto-mode
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        name: read-only
        description: Read-only sandbox; wider retries require approval.
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: workspace-write
        description: Write inside the workspace and permitted temporary directories; wider retries require approval.
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: danger-full-access
        description: Full file access without approval prompts.
      auto-mode:
        sandbox: workspace-write
        approval: ask
        name: Better Auto Review
        description: Workspace-write sandbox; a reviewer model answers each request to escalate this one call to full access.

- insert:
    # A dedicated read-only agent preset for the reviewer child. It has only
    # read/glob/grep and no agent-instructions/time-context rows, so AGENTS.md and
    # project instructions cannot steer the safety verdict.
    - id: preset-better-auto-review-readonly
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: better-auto-review-readonly
        name: Auto Review (read-only)
        description: Read-only reviewer used by Better Auto Review; can read, glob and grep, but never modify.
        order: 90
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a read-only safety reviewer. Inspect only when needed and never modify anything.
              includeRuntimeContext: false
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

    - id: better-auto-review
      name: '@ericstonechina/better-auto-review'
      config:
        provider: magpie-responses
        model: codex/gpt-6.2-sol
        # Review with a dedicated low-effort route and a hard time budget. These
        # defaults prevent one broken sandbox from consuming the main model's
        # quota through repeated reviews.
        reviewerProvider: magpie-responses
        reviewerModel: codex/gpt-6.2-sol
        reviewerReasoningEffort: low
        reviewerTimeoutMs: 60000
        maxTokens: 800
        # The reviewer runs as a read-only child agent by default. Its whitelist
        # is enforced twice: by the preset above and by the tools/pre-execute gate.
        reviewerSubagent: true
        reviewerSubagentProvider: spawn
        reviewerPreset: better-auto-review-readonly
        reviewerTools:
          - read
          - glob
          - grep
        reviewerFallback: llm
        preset: auto-mode
        baselineSandbox: workspace-write
        maxConsecutiveDenials: 3
        denialWindowSize: 10
        maxWindowDenials: 6
        maxReviewsPerTurn: 10
        maxFailuresPerTurn: 10
        verdictCacheTtlMs: 60000
        verdictCacheMaxEntries: 128
        onError: deny
